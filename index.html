<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Hızlı Okuma</title>
  <meta name="description" content="Araştırmaya dayalı, Türkçeye uyarlanmış okuma hızlandırma antrenmanı.">
  <meta name="theme-color" content="#fcfcfb" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1a1a19" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Hızlı Okuma">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <script>
    try {
      const t = JSON.parse(localStorage.getItem('tsr-durum-v1') || '{}').ayarlar?.tema;
      if (t === 'acik' || t === 'koyu') document.documentElement.dataset.tema = t;
    } catch {}
  </script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="ust">
    <button class="logo" data-git="pano" aria-label="Ana sayfa">Hızlı Okuma</button>
    <nav aria-label="Bölümler">
      <button data-git="pano">Pano</button>
      <button data-git="ilerleme">İlerleme</button>
      <button data-git="ayarlar">Ayarlar</button>
    </nav>
  </header>
  <main id="ekran" tabindex="-1">
    <p class="yukleniyor">Yükleniyor…</p>
  </main>
  <div id="ipucu" class="ipucu" role="status" hidden></div>
  <noscript><p class="kart">Bu uygulama JavaScript ister.</p></noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
